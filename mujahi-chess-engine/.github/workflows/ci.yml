name: MUJAHI Chess Engine CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-unit-tests:
    name: API Unit Tests (Node 24 LTS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated unit tests
        run: npm test

  docker-real-stockfish-integration:
    name: Docker Build & Real Stockfish 19 Integration
    runs-on: ubuntu-latest
    needs: api-unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS for test runner
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Render Docker image (compiles Stockfish 19 sf_19)
        run: docker build -t mujahi-chess-api:ci ./api

      - name: Run container and execute real-engine integration tests & benchmark
        run: |
          docker run -d --name mujahi-ci -p 3000:3000 \
            -e NODE_ENV=production \
            -e ENGINE_THREADS=1 \
            -e ENGINE_HASH_MB=64 \
            -e ENGINE_MAX_DEPTH=20 \
            -e CORS_ALLOWED_ORIGINS=https://mujahi-chess.vercel.app \
            mujahi-chess-api:ci

          trap 'docker logs mujahi-ci || true; docker rm -f mujahi-ci || true' EXIT

          node api/tests/integration-docker.js
          docker exec mujahi-ci npm run bench
